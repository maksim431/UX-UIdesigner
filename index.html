<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX/UI design</title>
  <meta name="description" content="UX/UI-дизайн: портфолио Максима">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UX/UI design">
  <meta property="og:description" content="UX/UI-дизайн: портфолио Максима">
  <meta property="og:image" content="https://framerusercontent.com/images/cj21tiLG0LzbWV4oGkK3VhIKziU.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" hreflang="ru" href="https://maksim431.github.io/UX-UIdesigner/">
  <link rel="alternate" hreflang="en" href="https://maksim431.github.io/UX-UIdesigner/en/">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <script>
    // Прелоадер показываем при входе на сайт и при обновлении страницы,
    // а при возврате на первый экран внутри сайта — нет (как во Framer).
    (function () {
      var play = true
      try {
        var nv = performance.getEntriesByType('navigation')[0]
        var reload = nv && nv.type === 'reload'
        if (!reload && sessionStorage.getItem('loaderPlayed')) play = false
      } catch (e) {}
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) play = false
      if (play) document.documentElement.classList.add('fs-loading')
      // страховка, если скрипт не загрузится
      // выбран английский — сразу открываем английскую версию
      try { if (localStorage.getItem('lang') === 'en') { location.replace('en/'); return } } catch (e) {}
      setTimeout(function () { if (!document.documentElement.classList.contains('fs-reveal')) document.documentElement.classList.remove('fs-loading') }, 6000)
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/site.css?v=3">
  <link rel="prefetch" href="assets/js/water.js">
</head>
<body>
  <nav class="lang fs-lang" aria-label="Язык"><span aria-current="true">ru</span><i aria-hidden="true">/</i><a href="en/" hreflang="en" lang="en" data-lang="en" data-scramble="140">en</a></nav>
  <main class="fs">
    <div class="fs-wrap fs-choice">
      <div class="fs-head" data-rv="1">
        <h1 class="fs-hi">привет!</h1>
        <p class="fs-sub">выберите версию портфолио по интересам</p>
      </div>
      <div class="fs-cards" data-rv="2">
        <a class="fs-opt" href="product/" data-go data-scramble="90">
          <span class="fs-opt__txt">мне интересны последовательность действий в работе, метрики, «cjm», «jtbd», «retention», «ltv»<br>и другие термины</span>
          <span class="btn fs-btn fs-opt__btn" data-scramble-text>выбрать</span>
        </a>
        <a class="fs-opt" href="web/" data-go data-scramble="90">
          <span class="fs-opt__txt">я хочу просто покормить карпа<br>и посмотреть картинки</span>
          <span class="btn fs-btn fs-opt__btn" data-scramble-text>выбрать</span>
        </a>
      </div>
    </div>
  </main>

  <div class="fs-loader" aria-hidden="true">
    <canvas></canvas>
    <div class="fs-card" role="status">
      <span class="fs-card__label">загрузка портфолио</span>
      <span class="fs-card__bar">[░░░░░░░░░░░░░░░░] 000%</span>
    </div>
  </div>

  <script type="module" src="assets/js/first.js"></script>
</body>
</html>
