<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX/UI design</title>
  <meta name="description" content="UX/UI design: Maksim’s portfolio">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UX/UI design">
  <meta property="og:description" content="UX/UI design: Maksim’s portfolio">
  <meta property="og:image" content="https://framerusercontent.com/images/cj21tiLG0LzbWV4oGkK3VhIKziU.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" hreflang="ru" href="https://maksim431.github.io/UX-UIdesigner/">
  <link rel="alternate" hreflang="en" href="https://maksim431.github.io/UX-UIdesigner/en/">
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <script>
    // preloader on entry and on reload,
    // not when coming back within the site
    (function () {
      var play = true
      try {
        var nv = performance.getEntriesByType('navigation')[0]
        var reload = nv && nv.type === 'reload'
        if (!reload && sessionStorage.getItem('loaderPlayed')) play = false
      } catch (e) {}
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) play = false
      if (play) document.documentElement.classList.add('fs-loading')
      // fallback
      setTimeout(function () { if (!document.documentElement.classList.contains('fs-reveal')) document.documentElement.classList.remove('fs-loading') }, 6000)
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css?v=3">
  <link rel="prefetch" href="../assets/js/water.js">
</head>
<body>
  <nav class="lang fs-lang" aria-label="Language"><a href="../" hreflang="ru" lang="ru" data-lang="ru" data-scramble="140">ru</a><i aria-hidden="true">/</i><span aria-current="true">en</span></nav>
  <main class="fs">
    <div class="fs-wrap fs-choice">
      <div class="fs-head" data-rv="1">
        <h1 class="fs-hi">hi!</h1>
        <p class="fs-sub">choose the portfolio version that fits your interests</p>
      </div>
      <div class="fs-cards" data-rv="2">
        <a class="fs-opt" href="product/" data-go data-scramble="90">
          <span class="fs-opt__txt">i’m interested in the work process, metrics, “cjm”, “jtbd”, “retention”, “ltv”<br>and other terms</span>
          <span class="btn fs-btn fs-opt__btn" data-scramble-text>choose</span>
        </a>
        <a class="fs-opt" href="web/" data-go data-scramble="90">
          <span class="fs-opt__txt">i just want to see quality work cases without complex terms</span>
          <span class="btn fs-btn fs-opt__btn" data-scramble-text>choose</span>
        </a>
      </div>
    </div>
  </main>

  <div class="fs-loader" aria-hidden="true">
    <canvas></canvas>
    <div class="fs-card" role="status">
      <span class="fs-card__label">loading portfolio</span>
      <span class="fs-card__bar">[░░░░░░░░░░░░░░░░] 000%</span>
    </div>
  </div>

  <script type="module" src="../assets/js/first.js?v=2"></script>
</body>
</html>
