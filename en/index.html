  <script>
    // preloader on entry and on reload,
    // not when coming back within the site
    (function () {
      var play = true
      try {
        var nv = performance.getEntriesByType('navigation')[0]
        var reload = nv && nv.type === 'reload'
        if (!reload && sessionStorage.getItem('loaderPlayed')) play = false
      } catch (e) {}
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) play = false
      if (play) document.documentElement.classList.add('fs-loading')
      // fallback
      setTimeout(function () { if (!document.documentElement.classList.contains('fs-reveal')) document.documentElement.classList.remove('fs-loading') }, 6000)
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
