# Разовая задача: скачивает картинки кейсов с Framer в репозиторий, чтобы сайт не зависел от Framer.
# Список «путь → адрес» лежит в .github/fetch-images.tsv. Запускается при его изменении или вручную.
name: fetch-client-images
on:
  push:
    branches: [main]
    paths: ['.github/fetch-images.tsv']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -u
          ok=0; fail=0
          while IFS=$'\t' read -r path url; do
            [ -z "$path" ] && continue
            tmp=$(mktemp)
            if curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "$tmp"; then
              case "$(file -b --mime-type "$tmp")" in
                image/png) ext=png ;; image/svg+xml) ext=svg ;; image/webp) ext=webp ;; image/gif) ext=gif ;; *) ext=jpg ;;
              esac
              out="${path%.*}.$ext"
              mkdir -p "$(dirname "$out")"; mv "$tmp" "$out"; echo "OK $out"; ok=$((ok+1))
            else
              echo "FAIL $path $url"; fail=$((fail+1))
            fi
          done < .github/fetch-images.tsv
          echo "ok=$ok fail=$fail"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/client
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "Download client page images from Figma into the repo" && git push)
